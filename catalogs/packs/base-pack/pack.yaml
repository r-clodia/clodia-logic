name: base-pack
description: >-
  Pack di base della piattaforma Clodia (first-party, sempre presente): solo le
  primitive trasversali di piattaforma + gli agent seed di sistema (clodia,
  ophelia, messaggero, sysadmin, segretario). A differenza dei pack di terze parti è trusted per
  costruzione: non passa dal security-review gate e non è disinstallabile.
version: 7.15.1
license: AGPL-3.0-or-later
first_party: true
# Sorgente per Check update / Update (Opzione A): il pack si aggiorna dal suo
# repo GitHub. base-pack vive nel motore (clodia-logic, pubblico); i pack di
# clodia-packs dichiarano repo=r-clodia/clodia-packs path=packs/<nome>.
upstream:
  repo: r-clodia/clodia-logic
  path: catalogs/packs/base-pack
  ref: main
# Elenco esplicito (oltre alla scoperta dalle dir agents/plugins): serve al
# manifest registrato in datadir/packs così la view Packs mostra il contenuto
# anche prima di un (re)install. install_pack_from_root li ri-scopre comunque.
agents:
  - clodia
  - ophelia
  - messaggero
  - sysadmin
  - segretario
plugins:
  - base-pack
# `contacts` (10 set 2026): staccato dal pack tomato — un CRM di anagrafiche
# non è di un'azienda, è di piattaforma. Letto/scritto dai nuovi verbi
# datastore.read/datastore.write (clodia-tools 2.13.0), gated da clearance +
# seeds (schema in server/api/plugin_import.py::_sanitize_datastores). Le
# skill osint-lead/linkedin-reactions restano nel pack tomato e continuano a
# referenziarlo con <DATASTORE:contacts> — risolto cross-pack da skill_sync.
datastores:
  - path: data/contacts.db
    name: contacts
    purpose: "CRM contatti — anagrafiche persone/aziende (arricchimento OSINT), indipendente da azienda"
    pii: true
    backup: true
    clearance: "SEAL-1"
    seeds: ["messaggero", "clodia"]
