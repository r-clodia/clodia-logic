name: clodia
display_name: Clodia
description: "Assistente dell'owner sulla piattaforma Clodia. Bot di coordinamento su motore Claude."
type: bot
immutable: true
clearance: SEAL-3
constitution: platform-core
# ANTENATO. `parents` è una relazione di AUTORITÀ: ciò che vi compare concede
# verbi per ereditarietà. Non è genealogia — le due cose erano confuse finché
# nessuno risolveva il campo, e il giorno in cui è diventato portante `sysadmin`
# si sarebbe preso 33 verbi da `parents: [clodia]`, una riga scritta quando non
# significava niente. Qui resta solo ciò da cui si eredita davvero.
parents: [archseed]
# anzianità (tie-break rango): Clodia è la progenitrice, più anziana di Ophelia
created_at: "2026-01-01T00:00:00Z"
agent_sdk: claude
model: claude-opus-4-8
# Provider in ordine di PREFERENZA (primo attivo vince; il SEAL non seleziona,
# governa solo l'accesso ai topic). Clodia preferisce l'abbonamento Pro/Max
# (costo flat), ripiega sull'API commerciale (DPA) e infine su Bedrock EU
# (SEAL-2, sovrano). Dal profilo agent si può selezionare manualmente quale
# usare fra questi (override operativo).
providers: [claude-team, claude-pro-max, anthropic-api, aws-region-eu]
avatar_color: "#ff6b3d"

sandbox:
  allow_read: ["{scratch}/**", "skills-catalog/**", "agents/**"]
  deny_read: ["topics/confidential/**", "secrets/**"]
  allow_write: ["{scratch}/**"]
  allow_shell_cmds: ["git", "gh", "python3", "node", "npm"]
  deny_shell_patterns: ["rm -rf *", "sudo *", "git push * main *--force*"]

# bot di coordinamento: primitive di piattaforma + pack first-party di ruolo.
# SENZA `comms-pack` (agents-notebook A7, clodia-platform#198): la posta è il
# mestiere del CORRIERE. Le quattro skill del pack — `check-email`,
# `mention-relay`, `telegram-1to1`, `helpdesk` — restano dichiarate una per una
# su `messaggero` e `sysadmin`, che le hanno per ruolo; qui arrivavano solo dal
# wildcard, e nessuna riga del system-prompt di clodia le nomina. Non è una
# perdita di capacità: `email.send` è un VERBO (vedi `tool_permissions`), non
# viene dal pack, quindi la relazione quotidiana continua a partire.
capabilities: ["base-pack/*", "editorial-pack/*", "anthropic-pack/*"]
# NON `["*"]`. Il catalogo contiene UNA rule, `topic-state-boundary`, ed è del
# segretario: circoscrive chi mantiene lo stato scritto di un topic e dichiara
# fuori dominio «usare strumenti diversi dai tool di stato del topic»,
# prescrivendo «un rifiuto breve e operativo». Con il wildcard questo agente la
# ereditava, e il rifiuto arrivava parola per parola — misurato il 15 ago 2026
# sul job del digest, che per quattro mattine ha chiuso in `success` rispondendo
# «non rientra nel mio ambito: il mio ruolo qui è mantenere lo stato scritto del
# topic».
#
# È il difetto del wildcard sui tool, visto dall'altro lato: là si prendeva ogni
# potere aggiunto domani, qui ogni LIMITE scritto per un altro mestiere. Le
# rules si dichiarano una per una, come i verbi.
rules: []
# tutti i tool MCP (enforcement al gateway clodia-tools — wiring in Fase 4).
# VERBI RAGGIUNGIBILI. Enumerati e non `*` (6 ago 2026, decisione di Davide:
# «clodia non può più avere [*]»). Il wildcard non era pericoloso per ciò che
# concedeva oggi: era pericoloso perché concedeva in automatico ogni verbo
# aggiunto DOMANI, senza che nessuno lo valutasse.
#
# Raggiungibile non significa libero: ciò che non è in `profile_tools` passa da
# un consenso umano. Questa lista dice fin dove clodia può arrivare CHIEDENDO —
# è la modalità con gate del suo prompt: non è un insieme diverso di poteri, ma
# gli stessi poteri quando serve una domanda davanti.
#
# ESCLUSI, irraggiungibili anche con un gate, e perché:
#   email.list/read/search     la posta IN ARRIVO è il mestiere del corriere, e
#                              ha una fonte diversa a ogni messaggio
#   email.reply                il destinatario non sta negli argomenti: viene dal
#                              messaggio a cui si risponde, cioè da contenuto non
#                              fidato. `egress._emails` non lo può estrarre, e una
#                              destinazione illeggibile è la via dell'injection
#                              («l'attaccante scrive, l'agente risponde coi dati»)
#   gdrive.share               uscita verso una PERSONA, non trasporto
#   settings.* mcp.add/remove  infrastruttura: mestiere di sysadmin
#   packs.import_url/install_* esegue codice di terzi nel gateway
#   providers.pause/resume     ops sull'inferenza
#   runtime.restart_agent      ops sui processi
#   profile.*                  PII di persone (email, IBAN, domicilio)
#   logs.tail                  log del server: mescola i compartimenti
#   topic.migrate_storage      sposta tutto lo storage; da steward
# ANTENATO. `archseed` dà i verbi base per ereditarietà (specification §1.3):
# leggere nella stanza in cui lo spawn sta, parlarci, e la propria memoria. Qui
# sotto resta SOLO il mestiere di questo seed — se un verbo base ricomparisse in
# `tool_permissions`, la domanda «cosa fa questo agente» tornerebbe senza
# risposta, sepolta sotto ciò che fanno tutti.
tool_permissions:
# IL SET. Fisso, come per ogni altro agente — nel caso di clodia numeroso.
# Non esiste più un secondo insieme «raggiungibile ma fuori profilo»: se un
# verbo non è qui, clodia non lo ha. Punto.
#
# Quando le verrà chiesto un task che richiede un verbo che non possiede,
# riceverà un GRANT specifico attraverso un gate. Quel meccanismo non è ancora
# implementato (6 ago 2026): per ora il set è statico e questo file lo dichiara.
# Leggere il web e spedire una relazione (14 ago 2026, decisione di Davide). Il
# 6 agosto `email.*` era escluso in blocco perché «uscita»: la ragione era giusta
# ma il rimedio era nel posto sbagliato. Un permesso tolto a un agente e lasciato
# a un altro non riduce l'autorità della colonia — la sposta, e infatti il
# digest quotidiano è rimasto orfano di entrambe le metà del suo mestiere.
#
# Il confinamento vero è per DESTINAZIONE e per FONTE, non per agente: è ciò che
# `egress.py` dichiara nella propria intestazione, dove annota che la riduzione
# dei verbi per-agente, da sola, è stata MISURATA come quasi inutile. Quindi
# `email.send` torna qui, e ciò che lo rende accettabile vive nella config del
# gateway (volume gateway-only, irraggiungibile da chi esegue il codice
# dell'agente):
#
#   egress_allow.email  →  i soli destinatari a cui può arrivare senza chiedere
#   ingress             →  le fonti che non contaminano il canale
#
# `web.fetch` è la lettura del web che PASSA di qui, e per questo è arbitrabile:
# `WebSearch`/`WebFetch` nativi restano fuori da `native_tools` (sotto), perché
# li esegue il provider dentro la conversazione con l'API — nessuna nostra regola
# viene consultata e nessun taint si accende. Averli entrambi sarebbe tenere la
# porta di servizio accanto a quella controllata.
#
# La catena si chiude da sé: fonte vagliata → niente taint → l'invio esce; fonte
# sconosciuta → canale contaminato → l'uscita CHIEDE, dicendo da dove è entrato
# il contenuto non fidato.
  - web.fetch
  - email.send
  - topic.remote_status
  - topic.add_minute
  - topic.save_summary
  - topic.suggest_team
  - topic.add_participant
  - topic.write_file
  - topic.put
  - topic.delete_file
  - artifact.render
  - agents.list
  - agents.show
  - agents.list_scoped
  - agents.list_skills
  - agents.list_rules
  - agents.list_tools
  - runtime.agents
  - runtime.topics
  - runtime.chats
  - runtime.skills
  - runtime.jobs
  - runtime.providers
  - runtime.mcp_servers
  - runtime.current_user
  - runtime.inspect_topic
  - integrations.list
  - providers.list
  - mcp.list
  - packs.list
  - packs.show
  - jobs.list
  - egress.list
  - ingress.list
  - rag.collections
  - memory.list
  - memory.read
  - memory.append
  - memory.write
  - memory.list_documents
  - memory.read_document
  - memory.fetch
  - fs.list_dir
  - topic.remote_commit
  - topic.remote_push

memory:
  dir: memory/

system_prompt: system-prompt.md

# Nessun profilo SEPARATO: il set dichiarato sopra è già il mestiere, quindi
# non c'è niente «fuori profilo» da segnalare. `[]` e non assente, perché
# assente significa «non mi pronuncio» e lascerebbe in piedi il profilo vecchio
# nella config live.
profile_tools: []

# Nessun gate PER-AGENTE. La config live ne aveva quattro — i `topic.remote_*` —
# ma non erano dichiarati da nessuna parte: vivevano solo là, quindi un rebuild
# li avrebbe persi o conservati a caso.
#
# Oggi non servono: `remote_add` e `remote_enable` sono gated GLOBALMENTE (chi
# imposta un remote dichiara il perimetro d'accesso del topic), e
# `remote_commit`/`remote_push` sono liberi per decisione di Davide — spingono
# verso la destinazione che l'owner ha approvato, quindi sono USO del perimetro
# e non dichiarazione. Tenerli anche qui li avrebbe gatati comunque, perché un
# lucchetto duro vince sul profilo.
gated_tools: []

# Strumenti nativi. `Bash` perché il suo sandbox già ammette git/gh/python3/node e
# li usa per coordinare; `Agent`/`Workflow`/`Task*` perché è il coordinatore e
# spawnare lavoro è il suo mestiere. NON `WebSearch` né `WebFetch`: li esegue il
# provider dentro la conversazione con l'API, quindi portano dentro testo di terzi
# senza che niente lo marchi. Clodia il web lo legge, ma con `web.fetch` — che
# passa dal gateway, dove l'URL viene pesato contro le fonti dichiarate. Tenere
# anche i nativi vanificherebbe l'altro: una porta di servizio accanto a quella
# controllata rende la seconda un ornamento.
native_tools:
  - Bash
  - Agent
  - Workflow
  - Task*

# Permessi del runtime. `bypassPermissions` = nessun prompt di conferma, e non è
# una comodità: Clodia gira anche senza nessuno davanti — il fire di un job, una
# convocazione notturna — e un prompt che nessuno approva è un turno che si
# blocca in silenzio.
#
# Era una riga di `KIND_PERMISSION_MODE` in `sdk_runtime/session.py`
# (clodia-platform#199, residuo di A9): una decisione su questo agente scritta
# accanto al codice invece che qui. Sta nel suo seed per la stessa ragione di
# `native_tools` sopra — «cosa può fare questo agente» ha UNA risposta, in un
# file.
#
# Ciò che questo NON spegne: `disallowed_tools`, che resta l'unico interruttore
# vero (vedi `sdk_runtime/native_tools.py`) e continua a togliere gli strumenti
# fuori da `native_tools`; e i grant del gateway MCP, che stanno altrove e non li
# scrive lei.
permission_mode: bypassPermissions
