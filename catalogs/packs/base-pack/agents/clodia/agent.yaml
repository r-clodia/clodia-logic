system_prompt: system-prompt.md

# MESTIERE DICHIARATO (profile_tools). Questi verbi clodia li usa senza
# chiedere; tutto ciò che raggiunge con `*` e NON è qui resta raggiungibile ma
# passa da un consenso umano — least authority per SUPERVISIONE invece che per
# rimozione. È la «modalità super» di cui parla il suo prompt: non un insieme
# diverso di poteri, ma gli stessi poteri con una domanda davanti.
#
# Il criterio, in una riga: legge tutto, parla, verbalizza, e muta i file del
# topic (perimetro approvato dall'owner). Non fa i mestieri altrui — posta,
# Drive, calendario, Trello — e non tocca il ciclo di vita del topic né il suo
# remote.
#
# `topic.add_participant` è nella lista ma è gated GLOBALMENTE: elencarlo non lo
# libera. Costruire la squadra chiederà sempre conferma, per scelta (auto-invito
# = confused deputy).
profile_tools:
  - topic.open
  - topic.list
  - topic.search
  - topic.files
  - topic.read_file
  - topic.read_document
  - topic.fetch
  - topic.remote_status
