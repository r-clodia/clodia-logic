# Seed "Archseed" — l'ANTENATO ASTRATTO da cui ogni altro seed discende
# (specification §1.3 e §1.4). Non si spawna: esiste per essere ereditato.
#
# COSA CI VA. Il pavimento è quello che serve a PARTECIPARE: leggere ciò che c'è
# nella stanza in cui lo spawn si trova, e parlarci. Quello che un agente
# PRODUCE è il suo mestiere, e il mestiere lo dichiara il seed che eredita.
#
# La distinzione non è «dentro o fuori la stanza» — `topic.put` scrive dentro la
# stanza in cui lo spawn già sta, e resta fuori di qui lo stesso. È «partecipare
# o produrre», e la prova che è la linea giusta è empirica: `segretario` esiste
# PROPRIO per scrivere lo stato del topic, e lo dichiara con `topic.save_summary`.
# Se la scrittura stesse nel pavimento, quel seed non direbbe più niente — e la
# domanda «cosa fa questo agente» smetterebbe di avere risposta leggendo il suo
# file.
#
# COSA NON CI VA, e la misura che lo decide. L'intersezione reale dei verbi di
# tutti gli agenti non-wildcard è DUE verbi su un'istanza e VUOTA sull'altra. Due
# agenti sono stretti di proposito — `segretario` ne ha tre, `security-engineer`
# sette di sola lettura — e un arciseed che portasse `topic.*` li allargherebbe
# senza che nessuno l'avesse deciso. Da qui il pavimento: leggere e parlare, mai
# scrivere, mai spostare i muri, mai uscire.
#
# COME SI RESTRINGE. L'ereditarietà è un DEFAULT, non un tetto: un seed che deve
# essere più stretto del proprio antenato lo dichiara con `denied_tools`, che
# batte tutto. Senza quella via, questo file allargherebbe chi era stretto.
name: archseed
display_name: Archseed
description: "Antenato astratto di ogni seed: la propria memoria, la lettura dello scope in cui lo spawn sta, e la parola. Non si spawna."
type: bot

# NON ISTANZIABILE. Imposto al momento dello spawn, non solo dichiarato: un seed
# astratto materializzato per errore è un agente con i soli verbi base e nessun
# mestiere — funziona abbastanza da non farsene accorgere, e poi risponde male
# senza che nulla lo segnali.
abstract: true

# Nessun motore: un antenato non gira. I campi del provider restano assenti di
# proposito — dichiararli suggerirebbe che qualcosa possa eseguirlo.

tool_permissions:
  # la propria memoria, confinata alla propria cartella
  - memory.*

  # il pavimento di LETTURA dello scope corrente
  - topic.open
  - topic.files
  - topic.read_file
  - topic.read_document
  - topic.search
  - topic.list
  - topic.fetch

  # parlare non è mutare: uno spawn che non può parlare nella propria stanza non
  # può fare niente. È la stessa ragione per cui un `reader` conserva la parola
  # (§2.9).
  - topic.post_message

# ── Il pavimento degli strumenti NATIVI del runtime ──────────────────────────
#
# I ~30 tool della CLI non passano dal gateway, e nessuno li dichiarava: ogni
# agente li aveva tutti. Compreso `WebSearch`, che nessun firewall può arbitrare
# perché lo esegue l'infrastruttura del provider dentro la conversazione con
# l'API — misurato il 12 ago 2026, sei risultati tornati da un container in cui
# `curl example.com` non passa.
#
# COSA CI VA, con la stessa regola dei verbi qui sopra: quello che serve a
# LAVORARE nel proprio spawn. Leggere e scrivere nel proprio scratch, eseguire
# una skill, cercare uno strumento nell'elenco.
#
# COSA NON CI VA:
#   · `WebSearch` e `WebFetch` — portano dentro contenuto di terzi senza che la
#     piattaforma lo veda, quindi senza marcare il taint. Li dichiara il seed che
#     ne ha bisogno, e quel seed è per costruzione uno di cui si è deciso che può;
#   · `Agent` e `Workflow` — spawnano lavoro fuori dal registro degli spawn;
#   · `Cron*`, `Task*`, `ScheduleWakeup`, `Monitor`, `RemoteTrigger` — pianificano
#     fuori dal registro dei job;
#   · `Bash` — NON è nel pavimento. Un agente che deve eseguire comandi lo dice.
#
# `Bash` fuori dal pavimento è la scelta che si nota di più, e la ragione è che
# `Bash` è l'unico strumento che contiene tutti gli altri: con una shell si
# raggiunge la rete, il filesystem e ogni CLI installata, e nessuna delle liste
# qui sopra vale più niente. Chi ne ha bisogno lo dichiara, e allora si vede.
native_tools:
  - Read
  - Write
  - Edit
  - Skill
  - ToolSearch
  - TodoWrite
  - AskUserQuestion
