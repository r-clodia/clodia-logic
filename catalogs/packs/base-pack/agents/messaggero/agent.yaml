# Seed "Messaggero" — agente MESSAGGERO della colonia (hub comunicazioni).
# Auto-istanziata (agents-seed/): agente dedicato a email e Telegram (in
# prospettiva anche WhatsApp). Le comunicazioni trasportano documenti e
# informazioni provenienti da più topic → clearance minima SEAL-2.
# Modello telegram-proxy (18 lug): il messaggero è l'UNICA superficie esposta a
# Telegram. Inbound = relay meccanico server-side (ripete verbatim nel topic con
# handle autenticato; il messaggero non esegue/risponde); outbound = telegram.send
# esclusivo, su delega degli agenti. Seed multi-istanza: il binding è per-istanza
# (messaggero-#N ↔ set di chat_id via telegram.listen), non per-topic.
name: messaggero
parents: [archseed]
display_name: Messaggero
description: "Agente messaggero: email e Telegram per conto della colonia. Clearance SEAL-2 (le comunicazioni attraversano documenti di più topic)."
type: normal
clearance: SEAL-2
constitution: platform-core
# Runtime segue il provider effettivo: scaleway→opencode, aws-region-eu→claude.
# agent_sdk è il default/fallback quando nessun provider risolve.
agent_sdk: opencode
# Messaggero è un dispacciatore: non serve ragionamento pesante, basta affidabilità
# nel tool-use. Primario: gpt-oss-120b (open, sovrano) su scaleway via OpenCode.
model: gpt-oss-120b
# Provider: SOLO SEAL≥2 (= clearance di Messaggero); le comunicazioni trasportano
# documenti cross-topic fino a SEAL-2, mai su provider SEAL-1. Catena di fallback
# cross-SDK: scaleway (SEAL-3, gpt-oss via OpenCode) → aws-region-eu (SEAL-2,
# haiku via Bedrock/claude, override in provider_models). Nessun SEAL-1.
providers: [scaleway, aws-region-eu]
provider_models: {aws-region-eu: claude-haiku-4-5}
avatar_color: "#0ea5e9"
sandbox:
  allow_read: ["{scratch}/**"]
  deny_read: ["secrets/**"]
  allow_write: ["{scratch}/**"]
  allow_shell_cmds: []
  deny_shell_patterns: ["*"]
# Skill comms-pack mirate:
# - check-email: attesa di una email via job periodico che controlla la casella,
#   filtra il subject e inietta nel topic con @menzione;
# - telegram-1to1: la conversazione diretta su Telegram;
# - mention-relay: recapita sul gruppo collegato a un topic le menzioni che le
#   persone di quel gruppo ricevono nella conversazione. Il testo lo compone il
#   gateway, non il messaggero: il taglio dell'estratto e il link non devono
#   dipendere da come gira un turno.
capabilities: [comms-pack/check-email, comms-pack/telegram-1to1, comms-pack/mention-relay]
rules: []
# Tool comms (la fruizione degli account/token resta gated dai grant del vault:
# email account + telegram_bot_token delegati a Messaggero dalla sezione
# Connettori/Integrations). Enforcement effettivo nel gateway (config.yaml).
# post_message è prerogativa di messaggero+super. jobs.propose per creare il job
# periodico di check-email (l'owner lo approva, gated by design).
#
# ANTENATO. `archseed` dà i verbi base per ereditarietà (specification §1.3):
# leggere nella stanza, parlarci, e la propria memoria. A2 restringe Messaggero:
# trasporta riferimenti e allegati, ma non legge né scrive il filesystem del
# topic. I verbi ereditati incompatibili sono sottratti in `denied_tools`.
tool_permissions:
  - email.*
  - telegram.*
  - jobs.propose

# Omettere non restringe un antenato: questi verbi arrivano dall'archseed e
# vanno negati esplicitamente. `topic.open/search/list` restano metadati e stato
# conversazionale; non espongono i byte del filesystem. Gli allegati outbound
# usano i riferimenti server-side `email.topic_files` / `telegram.send_file`.
denied_tools:
  - topic.files
  - topic.read_file
  - topic.read_document
  - topic.fetch
# Verbi che per QUESTO agent richiedono un consenso umano a ogni uso
# (clodia-platform#104). Dichiarati nel seed perché è qui che si sa quali dei
# propri verbi sono pericolosi — e perché un controllo che non viaggia col seed
# non esiste per il primo clone: prima queste liste stavano SOLO nella config del
# gateway, applicate a mano, e un'istanza nuova nasceva senza.
# Questa è la DICHIARAZIONE; l'autorità è la copia nel gateway, scritta alla
# registrazione. Il seed vive sulla datadir col codice degli agenti, e un agente
# capace di riscriverlo cancellerebbe i propri gate.
# NESSUN gate sul verbo. Rimosso il 7 ago 2026, e la ragione sta nel modello:
# un gate non è una proprietà del verbo, è ciò che accade quando un'azione
# ATTRAVERSA il confine dello scope. Spedire una mail attraversa il confine — e
# quel confine è già presidiato dove deve esserlo, cioè sulla DESTINAZIONE:
# un indirizzo che non sta in nessuna allowlist chiede l'approvazione, uno che
# ci sta no.
#
# `gated_in_channel` era un surrogato della domanda «chi sta chiedendo?», posta
# per approssimazione — *qualcuno è in un canale* — e l'approssimazione è
# grossolana in due modi. Una DM È un canale, quindi il criterio reale era
# «sempre tranne nei job»: chiedeva l'approvazione anche all'owner per la
# propria richiesta, nella propria DM. E non guardava affatto chi avesse
# chiesto, che è precisamente ciò che diceva di proteggere.
#
# La domanda ha una risposta esatta, ed è la catena `origin`: nomina
# `human:giovanni` o `human:davide` invece di dedurlo dalla stanza. Finché
# quella catena non è in enforcement, il presidio resta la destinazione — e la
# lista globale contiene solo recapiti dell'owner, quindi togliere questo gate
# non apre nulla che non fosse già approvato da lui.
#
# Dichiarata VUOTA, non omessa: `upsert_agent` è non distruttivo sui campi
# `None` — un campo assente significa «non mi pronuncio, tieni quello che hai»,
# non «azzera». È la scelta giusta (un seed parziale non deve poter cancellare
# in silenzio ciò che non nomina) e ha una conseguenza precisa: una RIMOZIONE va
# dichiarata. Togliendo solo le righe, il gate sarebbe rimasto vivo nella config
# del gateway — verificato il 7 ago 2026, restava dopo il deploy.
gated_in_channel: []
gated_tools: []
memory:
  dir: memory/
system_prompt: system-prompt.md

# Nessuno strumento nativo oltre il pavimento. È la porta dello scope: tutto ciò
# che porta dentro e fuori passa dai verbi del gateway, che hanno i gate. Uno
# strumento nativo qui sarebbe la seconda porta, quella che nessuno guarda.
native_tools:
  []
