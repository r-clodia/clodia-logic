# Seed "Segretario" — verbalizzatore del topic. Compito unico e ristretto:
# mantenere summary.md (prima riga = TLDR + sezione "Prossimi passi") e le minute
# del topic. NON è un responder di conversazione: il routing lo sceglie SOLO
# quando si tratta di salvare/aggiornare lo stato del topic. Niente git, niente
# email/web/fs generale: solo i verbi di scrittura-stato del topic di cui è
# partecipante, più la sola proposta read-only della squadra quando sostituisce
# Clodia nel bootstrap. Modello piccolo ed economico (24B EU-sovrano su Scaleway): il
# task è regolare, non richiede ragionamento pesante.
name: segretario
parents: [archseed]
display_name: Segretario
description: "Segretario del topic: verbalizza minute e stato; se Clodia non è disponibile introduce il topic e propone la squadra."
type: bot
clearance: SEAL-2

# Ruolo di PIATTAFORMA, non della singola stanza (clodia-platform#497): nella
# lista dei partecipanti si legge «staff» invece di «contributor». Si dichiara
# qui e non in una lista della webui, così un seed di piattaforma nuovo porta il
# proprio badge senza che nessuno tocchi il frontend. Display e basta: non
# concede niente, i permessi restano clearance + partecipazione + `role`.
staff: true

# Il VICE. Subentra quando il coordinatore dichiarato non è nella stanza — la
# stessa ruling dell'11 ago 2026 che `agents/coordinator.py` tiene in una riga
# (`DECLARED`), qui letta dal lato di chi la eredita. Non decide niente: chi
# coordina lo sceglie sempre `coordinator.pick`, questo flag dice solo che il
# badge va scritto «acting manager» quando capita.
deputy: true
constitution: platform-core
agent_sdk: opencode
routing_mode: state_writer_only
all_tier: true
# Modello piccolo ottimizzato per task AGENTICI: gemma-4-26b-a4b-it su Scaleway
# (EU-hosted, SEAL-2). Scelto perché il segretario DEVE invocare i verbi
# (topic.save_summary/add_minute) da solo: verificato che con tool_choice=auto
# chiama i tool, mentre mistral-small-24b in auto tendeva a rispondere in prosa
# (chiacchierava invece di salvare lo stato). Costo basso, tool-use affidabile.
model: gemma-4-26b-a4b-it
providers: [scaleway]
provider_models: {}
avatar_color: "#64748b"
sandbox:
  allow_read: ["{scratch}/**"]
  deny_read: ["secrets/**"]
  allow_write: ["{scratch}/**"]
  allow_shell_cmds: []
  deny_shell_patterns: ["*"]
capabilities: [base-pack/team-composition]
rules:
  - topic-state-boundary
# Verbs are not declared here (#626, 27 Oct 2026): the room authorises them
# (Strumenti), global A·V·R·Q rules cover governance and outside rooms.
memory:
  dir: memory/
system_prompt: system-prompt.md
expertise: >-
  Salvare e aggiornare lo stato di un topic: scrivere e mantenere il summary
  (prima riga = TLDR sintetico) e la sezione prossimi passi, verbalizzare le
  minute delle riunioni e delle decisioni, tenere ordinati i file del topic.
  Interviene solo quando l'utente chiede di salvare lo stato, aggiornare il
  summary, mettere a verbale, chiudere/riepilogare la sessione del topic o
  aggiornare i prossimi passi; nei topic nuovi introduce lo scopo e propone la
  squadra soltanto quando Clodia non è disponibile. Non risponde a domande
  tecniche, diagnostica piattaforma, sviluppo, routing, codice o issue tracking.

# Solo il pavimento. Tiene lo stato scritto di un topic: legge e scrive coi verbi
# del gateway, e non ha niente da eseguire.
native_tools:
  []
