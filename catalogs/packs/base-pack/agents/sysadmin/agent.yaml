name: sysadmin
display_name: Sysadmin
description: "Steward della piattaforma (guida WebUI + platform-ops): è l'agente del widget di assistenza — guida l'utente alla pagina giusta (marker goto), fa triage, guida il setup delle integrazioni — E amministra la piattaforma entro i tool realmente esposti: pack import/remove/setup_done, provisioning pack dichiarato (pip/npm runtime, bin check, MCP mount, RAG collection/ingest), agent capability grant/revoke, job, workflow, provider, integration, settings, runtime restart/diagnosi, lettura codice/log. CONFINI HARD: clearance SEAL-1 (mai dati confidenziali), accede ai FILE dei topic con le regole comuni (participant + clearance, via topic.*; cross-topic → gate) e li ispeziona dal widget entro clearance (runtime.inspect_topic), nessun segreto. (Consolida janitor + sysadmin.)"
type: normal
# Immutabile a runtime: agent di sistema, si modifica solo via seed/rebuild.
immutable: true
# Clearance minima interna: SEAL-1. Sotto la soglia del confidenziale (SEAL-2+):
# per costruzione non può accedere a dati confidenziali. Nessun canale utente.
clearance: SEAL-1
constitution: platform-core
parents: [archseed, clodia]
created_at: "2026-07-07T00:00:00Z"
agent_sdk: claude
model: claude-sonnet-5
providers: [claude-team, claude-pro-max, anthropic-api, aws-region-eu]
avatar_color: "#f59e0b"
mailbox_parent: clodia

# Il mestiere di Sysadmin è l'operatività di piattaforma via tool gated. Include
# il provisioning dichiarato dai pack con tool stretti del gateway: pip/npm in
# runtime persistente, verifica binari, mount MCP, RAG create/ingest. CONFINI HARD:
#   • TOPIC — STESSE REGOLE DEGLI ALTRI AGENT (participant + clearance):
#     - FILE dei topic: legge/scrive via i tool `topic.*` (list_files/read_file/
#       put_file/delete_file/…) come qualunque worker. L'accesso è enforced dal
#       gateway: dev'essere PARTICIPANT del topic e avere clearance ≥ tier; su un
#       topic di cui NON è participant scatta il gate cross-topic (approvazione
#       owner). Nessun accesso RAW-FS ai topic (deny_read topics/**): come per
#       messaggero, il canale ai file sono i TOOL, non il filesystem.
#     - Ispezione dal widget: `runtime.inspect_topic` (metadati + agenti + ultimi
#       messaggi) anche da NON-participant, ma solo entro la clearance (SEAL < tier
#       → 403). I confidenziali sopra la sua SEAL restano invisibili.
#     - `topic.post_message` resta prerogativa di super/messaggero (non di sysadmin).
#   • NIENTE confidenziale: clearance SEAL-1 < soglia SEAL-2; nessun dato utente fuori
#     dai datastore dichiarati dai pack.
#   • NIENTE segreti: no secrets/, no vault, no keystore provider (pause/resume di un
#     provider NON espone la chiave).
# LETTURA CODICE PLATFORM (per capire dove intervenire): `/clodia` è il repo
# clodia-logic (core, già nel container), `/platform-src/**` i sorgenti degli
# altri repo montati read-only (clodia-tools/web/pwa). Sola lettura; i segreti
# (secrets/, .env, vault) restano esclusi con precedenza sul deny.
sandbox:
  allow_read: ["{scratch}/**", "plugins/**", "packs/**", "runtime/**", "agents/**",
               "/clodia/**", "/platform-src/**"]
  # I path RELATIVI qui sotto sono risolti contro la cwd dell'agente (la radice
  # dello spawn), dove `topics/`, `secrets/` e `clodia-vault/` NON esistono: quelle
  # tre righe non corrispondono a nulla. Si tengono perché documentano l'intenzione
  # e perché un pack installato su un'istanza con layout diverso potrebbe averle
  # relative-raggiungibili — ma da sole non proteggono niente, e leggerle come una
  # protezione è il modo in cui nasce un buco vero (qualcuno allenta l'uid
  # convinto che il deny copra).
  #
  # Le versioni ASSOLUTE mordono davvero sul tool Read. Aggiunte dopo aver
  # verificato che `/datadir/secrets` e `/datadir/clodia-vault` erano coperti SOLO
  # dai permessi OS (root:root 700 contro l'uid dello spawn, 60000: negato dal
  # kernel — provato). Difesa in profondità: il kernel resta il confine, questo
  # rende il documento onesto.
  #
  # ⚠️ Con `allow_shell_cmds: ["*"]` queste regole sono AGGIRABILI per costruzione:
  # `Bash(* *)` significa che `cat` legge tutto ciò che l'uid può leggere. Per
  # sysadmin il confine è l'uid, non questo blocco. Vale anche per il punteggio
  # trifecta: chi ha la shell scavalca il gateway.
  deny_read: ["topics/**", "secrets/**", "clodia-vault/**",
              "/datadir/secrets/**", "/datadir/clodia-vault/**", "/datadir/topics/**",
              "/clodia/secrets/**", "/clodia/**/.env*", "/clodia/**/*.key",
              "/platform-src/**/secrets/**", "/platform-src/**/.env*", "/platform-src/**/*.key"]
  allow_write: ["{scratch}/**", "plugins/**", "runtime/**"]
  allow_shell_cmds: ["*"]
  deny_shell_patterns: []

capabilities:
  - "base-pack/*"
  - "comms-pack/helpdesk"  # è l'agente del widget di assistenza (canale SEAL-1 helpdesk)
rules: []
# ANTENATO. `archseed` dà i verbi base per ereditarietà (specification §1.3):
# leggere nella stanza in cui lo spawn sta, parlarci, e la propria memoria. Qui
# sotto resta SOLO il mestiere di questo seed — se un verbo base ricomparisse in
# `tool_permissions`, la domanda «cosa fa questo agente» tornerebbe senza
# risposta, sepolta sotto ciò che fanno tutti.
tool_permissions:
  # Remit PLATFORM-OPS pieno (lug 2026): sysadmin amministra la piattaforma su
  # tutti i namespace operativi. NB: quasi tutte le MUTAZIONI qui sotto sono
  # verbi GATED (M-gate) → ogni uso richiede comunque l'approvazione umana in
  # contesto; il grant apre la superficie, il gate resta il controllo a runtime.
  # I CONFINI HARD restano: SEAL-1 (mai confidenziale, per clearance), nessun
  # segreto. I FILE dei topic NON sono più vietati in assoluto: accesso via
  # topic.* con le regole comuni (participant + clearance + gate cross-topic).
  # ── GitHub: codice r-clodia in lettura + gestione issue ──
  # Grant espliciti invece di github.*: sysadmin può diagnosticare consultando
  # repository e release e gestire il ciclo di vita delle issue, senza ottenere
  # permessi di scrittura su codice, branch, release o configurazione dei repo.
  # ── Front-of-house (ex janitor): lettura stato UI non sensibile per guidare ──
  # ── File dei topic: stesse regole degli altri agent (es. messaggero) ──
  # list/read/put/delete file, open, summary/minute. Enforcement gateway:
  # participant + clearance ≥ tier; topic non-participant → gate cross-topic.
  # post_message resta bloccato (prerogativa super/messaggero) dal suo guard.
  #
  # `topic.*` ESPLOSO nell'elenco puntuale per togliere UN SOLO verbo,
  # `topic.add_participant` (clodia-platform#104 §10.2): sysadmin amministra la
  # piattaforma, non compone le squadre dei canali. Tutto il resto è conservato
  # verbo per verbo; l'elenco esplicito evita anche che un `topic.*` futuro
  # venga concesso in automatico (#104 §8).
  #
  # ⚠️ Da solo questo NON rende sysadmin incapace di allargare la composizione:
  # conserva `agents.*`, che il catalogo trifecta classifica come `expansion`
  # (grant/revoke di capability = fabbricare autorità). Per sysadmin il §10.2 va
  # completato dallo split di `agents.*` previsto in #104 §8. Vedi il PR.
  - "agents.*"          # capability degli altri agent (grant/revoke, gated) + list/show
  - "app_runtime.get"
  - "app_runtime.health"
  - "app_runtime.list"
  - "fs.list_dir"       # navigazione datadir (plugins/, runtime/)
  - "github.add_issue_comment"
  - "github.get_commit"
  - "github.get_file_contents"
  - "github.issue_read"
  - "github.issue_write"
  - "github.list_branches"
  - "github.list_commits"
  - "github.list_issues"
  - "github.list_releases"
  - "github.list_tags"
  - "github.search_code"
  - "github.search_commits"
  - "github.search_issues"
  - "integrations.*"    # osservazione/test dei connettori
  - "jobs.*"            # job schedulati (propose gated by design)
  - "logs.tail"         # diagnosi: ultimi log del server (read-only)
  - "mcp.*"             # mount/remove/list MCP server dichiarati dai pack
  - "packs.*"           # import/remove/setup_done + provisioning deps runtime dichiarate
  - "profile.*"         # profili/stile
  - "providers.*"       # pausa/ripresa provider di inferenza (gated) + list
  - "rag.*"             # create/list/search/ingest RAG collection entro clearance/grant
  - "runtime.*"         # introspezione runtime + restart_agent (include topics/chats: solo METADATI, non il contenuto)
  - "settings.*"        # settings di piattaforma (backup run/set/get/restore-test, gated)
  - "topic.add_minute"
  - "topic.archive"
  - "topic.delete_file"
  - "topic.invoke_hook"
  - "topic.migrate_storage"
  - "topic.new"
  - "topic.put"
  - "topic.remote_add"
  - "topic.remote_commit"
  - "topic.remote_disable"
  - "topic.remote_enable"
  - "topic.remote_pull"
  - "topic.remote_push"
  - "topic.remote_status"
  - "topic.remove_participant"
  - "topic.save_summary"
  - "topic.suggest_team"
  - "topic.write_file"
  - "web.post"          # POST HTTP generica, sempre gated per singola invocazione
  - "workflows.*"       # lifecycle delle run dei workflow (start/cancel/delete_run, gated) + list/status
  - egress.allow
  - egress.list
  - egress.revoke
  - ingress.allow
  - ingress.list
  - ingress.revoke
# Verbi che per QUESTO agent richiedono un consenso umano a ogni uso
# (clodia-platform#104). Dichiarati nel seed perché è qui che si sa quali dei
# propri verbi sono pericolosi — e perché un controllo che non viaggia col seed
# non esiste per il primo clone: prima queste liste stavano SOLO nella config del
# gateway, applicate a mano, e un'istanza nuova nasceva senza.
# Questa è la DICHIARAZIONE; l'autorità è la copia nel gateway, scritta alla
# registrazione. Il seed vive sulla datadir col codice degli agenti, e un agente
# capace di riscriverlo cancellerebbe i propri gate.
gated_tools:
- agents.create
- agents.delete
- agents.patch
- runtime.inspect_topic
- runtime.restart_agent
- settings.backup_run
- settings.restore_test
- topic.remote_add
- topic.remote_commit
- topic.remote_enable
- topic.remote_push
priority: 30
cost_profile: standard

memory:
  dir: memory/

system_prompt: system-prompt.md
