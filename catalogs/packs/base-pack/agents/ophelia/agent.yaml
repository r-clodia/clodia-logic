name: ophelia
display_name: Ophelia
description: "Gemella di Clodia su motore Codex (OpenAI). Bot operativo per sviluppo, debug e automazione."
type: bot
immutable: true
clearance: SEAL-3
constitution: platform-core
# ANTENATO. `parents` è una relazione di AUTORITÀ: ciò che vi compare concede
# verbi per ereditarietà. Non è genealogia — le due cose erano confuse finché
# nessuno risolveva il campo, e il giorno in cui è diventato portante `sysadmin`
# si sarebbe preso 33 verbi da `parents: [clodia]`, una riga scritta quando non
# significava niente. Qui resta solo ciò da cui si eredita davvero.
parents: [archseed]
# anzianità (tie-break rango): Ophelia nasce subito dopo Clodia
created_at: "2026-01-01T00:00:01Z"
agent_sdk: codex
# The ChatGPT SUBSCRIPTION, explicitly and only (owner's decision, 2 Oct 2026:
# no extra pay-per-use API cost). The subscription rejects the "-codex" model
# family with a 400 ("not supported when using Codex with a ChatGPT account",
# clodia-platform#333, #490), so the model is one the subscription accepts.
# Without `providers`, `gpt-5-codex` was routed to the paid `openai-api`
# provider, while the codex runtime still used the ChatGPT login: the 400 on
# every turn.
#
# `gpt-6-astra` since clodia-platform#493 (4 Oct 2026): the best model the
# subscription serves, measured on the owner's account with a real turn. It
# requires Codex CLI >= 0.153.0 (`minimal_client_version` in the catalog the CLI
# ships), so it is bound to the 0.160.0 pin in clodia-platform's
# `docker/base.Dockerfile` — on the previous 0.149.0 image every turn answers
# 400 "requires a newer version of Codex". A seed moved to a `gpt-6*` model
# before that image is deployed does not start.
#
# If Astra's quota on the owner's plan turns out to be too tight (not readable
# from here, the risk is written in #493), the fallback is `gpt-5.6-sol` — the
# previous value of this line — or `gpt-6-sol`, which OpenAI's own catalog
# marks as the successor of Sol.
model: gpt-6-astra
providers: [codex]
avatar_color: "#14b8a6"

sandbox:
  allow_read: ["{scratch}/**", "skills-catalog/**", "agents/**"]
  deny_read: ["topics/confidential/**", "secrets/**"]
  allow_write: ["{scratch}/**"]
  allow_shell_cmds: ["git", "gh", "python3", "node", "npm"]
  deny_shell_patterns: ["rm -rf *", "sudo *", "git push * main *--force*"]

# bot operativo: nessun trade largo dichiarato. I verbi base arrivano
# dall'archseed; [] significa «nessun mestiere extra qui», non «nessun verbo».
capabilities: ["base-pack/*", "business-pack/article-spec", "business-pack/editorial-review", "business-pack/fact-check", "comms-pack/*", "openai-curated-pack/*"]
# NON `["*"]`. Il catalogo contiene UNA rule, `topic-state-boundary`, ed è del
# segretario: circoscrive chi mantiene lo stato scritto di un topic e dichiara
# fuori dominio «usare strumenti diversi dai tool di stato del topic»,
# prescrivendo «un rifiuto breve e operativo». Con il wildcard questo agente la
# ereditava, e il rifiuto arrivava parola per parola — misurato il 15 ago 2026
# sul job del digest, che per quattro mattine ha chiuso in `success` rispondendo
# «non rientra nel mio ambito: il mio ruolo qui è mantenere lo stato scritto del
# topic».
#
# È il difetto del wildcard sui tool, visto dall'altro lato: là si prendeva ogni
# potere aggiunto domani, qui ogni LIMITE scritto per un altro mestiere. Le
# rules si dichiarano una per una, come i verbi.
rules: []
# Lettura e scrittura su Google Drive (18 set 2026, decisione di Davide),
# enumerati uno per uno — niente wildcard che si allarghi da solo al
# prossimo verbo gdrive aggiunto. `gdrive.share` resta ESCLUSO: è uscita
# verso una PERSONA, non trasporto di file (stessa classe di `email.reply`).
tool_permissions:
  - gdrive.list
  - gdrive.search
  - gdrive.mkdir
  - gdrive.upload
  - gdrive.update
  - gdrive.download
  - gdrive.rename
  - gdrive.move

memory:
  dir: memory/

system_prompt: system-prompt.md

# Come clodia: stesso sandbox (git/gh/python3/node), stesso mestiere di
# coordinamento. Nessuno strumento web.
native_tools:
  - Bash
  - Agent
  - Workflow
  - Task*
