version: "2.0.0"
owner: owner
status: APPROVED
input_schema:
  type: object
  properties:
    section:
      type: string
      description: "Sezione WebUI in cui l'utente si trova o pensa di trovarsi"
    symptom:
      type: string
      description: "Attrito, domanda o messaggio di errore riportato dall'utente"
  required: [symptom]
output_schema:
  type: object
  description: "Prossimo passo di supporto o escalation preparata"
  properties:
    next_step: {type: string}
    escalation_needed: {type: boolean}
required_tools:
  - runtime.health
  - runtime.inspect_topic
  - logs.tail
side_effects: [gated_governance]
idempotency_policy: confirmation_card_per_write
retry_policy:
  on_denied_scope: escalate
