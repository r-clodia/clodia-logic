name: comms-pack
description: >-
  Pack first-party per comunicazioni e supporto: email polling, Telegram 1:1 e
  helpdesk operativo. Separato dal base-pack per assegnarlo solo agli agenti di
  ruolo.
version: 1.3.0
license: AGPL-3.0-or-later
first_party: true
upstream:
  repo: r-clodia/clodia-logic
  path: catalogs/packs/comms-pack
  ref: main
plugins:
  - comms-pack

# Connettori dichiarati dal pack (grammatica di clodia-platform#516,
# `server/connectors/SCHEMA.md` in clodia-tools). Una dichiarazione NON è una
# concessione: dice che cos'è il connettore, non dove può arrivare — quello
# resta dell'owner che installa, al gate.
#
# Questo blocco è la metà «dichiarazione» di clodia-platform#522: riproduce
# ALLA LETTERA il Telegram cablato nel gateway (`egress.py`, `taint.py`,
# `topics_api.py`, `tools_api.py`), senza aggiungere né togliere nulla — ed è
# il riferimento contro cui #518 si è misurata, il motivo per cui qui non c'è
# nessuna forma, nessun verbo e nessun testo «migliorato» rispetto a oggi.
#
# Dalla fase 2 il blocco NON è più inerte: `plugins/comms-pack/.mcp.json` monta
# il backend MCP `telegram` (il codice sta in `plugins/comms-pack/mcp/
# telegram_mcp.py`) e il gateway, con l'interruttore d'istanza in posizione
# `pack` (`connectors: {telegram: pack}` in `profile.yaml`, clodia-tools 2.100.0),
# smette di implementare il namespace e lascia che sia questa dichiarazione a
# descriverlo. L'interruttore è per istanza e di default resta `native`: il pack
# si installa prima, si accende dopo.
connectors:
  - id: telegram
    manifest_version: 1
    namespace: telegram
    label: Telegram
    schemes:
      - scheme: tg
        direction: both
        label: Chat Telegram
        # Verbatim da `egress._DANGER["tg"]`: è la frase che l'owner legge al
        # gate prima di concedere, e cambiarla qui sarebbe cambiare, di fatto,
        # ciò su cui ha dato il consenso.
        danger: "una chat su Telegram, cioè su un'infrastruttura non tua."
        # Le DUE forme di `tg:`, e non ce n'è una terza (clodia-platform#363):
        # `egress._TG_GROUP` e `egress._TG_HANDLE`, stessi pattern.
        forms:
          - label: gruppo
            pattern: '^-?\d+$'
            example: '-1001234567890'
          - label: persona
            pattern: '^@[A-Za-z0-9_]{5,32}$'
            example: '@dadabit'
    providers:
      - id: bot
        label: Bot Telegram
        credential:
          kind: form
          vault_entry: telegram_bot_token
          fields:
            - name: token
              label: Bot token
              secret: true
              placeholder: '123456:ABC-DEF…'
    # Solo i due verbi che oggi il PDP controlla davvero (`egress._SPECS`), con
    # lo stesso argomento e lo stesso `dtype`. `telegram.inbox`/`poll` NON sono
    # qui come `source`: oggi non passano da `_RESOURCE_READ_VERBS`, e
    # dichiararli sarebbe inventare un controllo che non esiste.
    verbs:
      - verb: telegram.send
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
      - verb: telegram.send_file
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
    # Letture che portano contenuto di terzi: `taint._TAINTING_EXACT`.
    taint:
      - telegram.inbox
      - telegram.receive
      - telegram.pull
    # Il bottone del topic: oggi `topics_api.telegram_link`, che fa i DUE passi
    # insieme — whitelist `tg:<chat_id>` nelle due direzioni e binding del
    # canale. `binding: channel` è il secondo passo; senza, il messaggero non
    # riporta nulla pur con la whitelist scritta.
    topic_actions:
      - id: telegram-link
        label: Collega una chat Telegram
        binding: channel
        fields:
          - name: chat_id
            label: Chat id o @handle
        adds:
          ingress:
            - 'tg:{chat_id}'
          egress:
            - 'tg:{chat_id}'
    # La card della pagina Tools. Dalla fase 2 di #522 i campi sono quelli del
    # manifest del gateway (`builtin_manifests/telegram.yaml`) CAMPO PER CAMPO:
    # quando l'interruttore d'istanza passa a `pack`, quel documento esce di
    # servizio e questa card prende il suo posto — una copia diversa qui non
    # sarebbe «una variante», sarebbe la scheda che cambia da sola il giorno
    # della migrazione. `status_verb` ora c'è e non è una promessa a vuoto: il
    # backend MCP del pack implementa `telegram.status` davvero.
    tools_card:
      icon: telegram
      setup_label: Collega un bot
      status_verb: telegram.status
      blurb: >-
        Gli agenti inviano/ricevono messaggi (tool telegram.*) con lease
        per-chat. Crea un bot dedicato con @BotFather e incolla il token.
      scope: api.telegram.org/bot
    # Il contesto che il GATEWAY riempie a ogni chiamata dei verbi di questo
    # namespace, sovrascrivendo sempre quello che è arrivato dal chiamante
    # (clodia-platform#522, PR 1 — `manifest.CONTEXT_VALUES`). Qui non è un
    # vezzo: un connettore nativo legge canale e agente dal claim FIRMATO della
    # sessione, un backend di pack quel claim non ce l'ha. `telegram.send` senza
    # `chat_id` scrive nella chat legata al canale chiamante, e il lease è di un
    # agente per nome: se i due valori venissero dagli argomenti, dichiararne
    # altri basterebbe per scrivere nel gruppo di un altro topic o per rubare il
    # lease a qualcun altro.
    context:
      - arg: channel
        value: channel
      - arg: agent
        value: agent
    # `telegram.send_file` manda un file che sta in un TOPIC. Il percorso lo
    # nomina l'agente, i byte li mette il gateway: leggere un file di topic è
    # lavoro suo e non si sposta — ci stanno attaccati il compartimento (chi
    # chiama dev'essere partecipante di quel topic) e l'audit di ciò che
    # attraversa il confine. Un backend che leggesse da sé il filesystem dei
    # topic salterebbe entrambi, e il percorso lo sceglie il chiamante.
    # `chat_id` omesso = la chat legata al topic da cui si chiama. La risolve
    # il GATEWAY: il registro dei binding è suo, lo scrive il bottone del topic
    # e tiene quelli di tutti i connettori — un backend che lo leggesse da sé
    # leggerebbe anche gli altri. Un `chat_id` esplicito vince: se il default
    # sovrascrivesse non si potrebbe più scrivere a un'altra chat.
    defaults:
      - verb: telegram.send
        arg: chat_id
        value: binding
      - verb: telegram.send_file
        arg: chat_id
        value: binding
    files:
      - verb: telegram.send_file
        path_arg: path
        bytes_arg: content_b64
        name_arg: filename
        tier_arg: tier
        topic_arg: name
        chat_arg: chat_id
