name: comms-pack
description: >-
  Pack first-party per comunicazioni e supporto: email polling, Telegram 1:1 e
  helpdesk operativo. Separato dal base-pack per assegnarlo solo agli agenti di
  ruolo.
version: 2.1.1
license: AGPL-3.0-or-later
first_party: true
upstream:
  repo: r-clodia/clodia-logic
  path: catalogs/packs/comms-pack
  ref: main
plugins:
  - comms-pack

# A pack is a distribution of components, each mounted in its container
# (clodia-platform#558, owner decision 2026-10-16; grammar in clodia-tools
# `server/connectors/SCHEMA.md`, «Components»):
#
#   gateway       `gateway/` below — the MAIL code (the eight `email.*` verbs,
#                 mailbox whitelist, strict ingress, topic attachments, reply
#                 recipient, the mailbox management of the Tools page, the
#                 IMAP/SMTP client). Fetched BY THE GATEWAY from this
#                 repository's default branch, pinned by commit, and imported
#                 inside the reference monitor. Never installed into the
#                 datadir, never loaded from it.
#   agent-server  `plugins/comms-pack`: the skills (check-email,
#                 telegram-1to1, helpdesk).
#   webui         nothing to ship: the topic buttons and the Tools cards are
#                 drawn from the `connectors:` manifest below (#520).
#
# The gateway runs the component for the connectors whose instance switch is
# on `pack` (`connectors: {mail: pack, telegram: pack}`), each half on its
# own; with both on `native` (the default) it stays pinned on standby and the
# gateway's own mail and Telegram code serve.
components:
  # ONE gateway component (the gateway allows one per pack: its pin carries
  # this manifest). It serves mail (clodia-platform#558) and, from 2.1.0,
  # Telegram (#522) — each only where the instance switch is on `pack`
  # (`host.serves`, needs clodia-tools ≥ 2.115.1). Credentials: the gateway's
  # custody, reachable per connector only while its switch is on `pack`.
  - id: comms
    target: gateway
    source:
      repo: r-clodia/clodia-logic
      path: catalogs/packs/comms-pack/gateway
      ref: main
    entry: comms_component
    connectors: [mail, telegram]
    credentials: [mailbox_, telegram_bot_token]

# Connettori dichiarati dal pack (grammatica di clodia-platform#516,
# `server/connectors/SCHEMA.md` in clodia-tools). Una dichiarazione NON è una
# concessione: dice che cos'è il connettore, non dove può arrivare — quello
# resta dell'owner che installa, al gate.
#
# Questo blocco è la metà «dichiarazione» di clodia-platform#522: riproduce
# ALLA LETTERA il Telegram cablato nel gateway (`egress.py`, `taint.py`,
# `topics_api.py`, `tools_api.py`), senza aggiungere né togliere nulla — ed è
# il riferimento contro cui #518 si è misurata, il motivo per cui qui non c'è
# nessuna forma, nessun verbo e nessun testo «migliorato» rispetto a oggi.
#
# Dalla fase 2 il blocco NON è più inerte: `plugins/comms-pack/.mcp.json` monta
# il backend MCP `telegram` (il codice sta in `plugins/comms-pack/mcp/
# telegram_mcp.py`) e il gateway, con l'interruttore d'istanza in posizione
# `pack` (`connectors: {telegram: pack}` in `profile.yaml`, clodia-tools 2.100.0),
# smette di implementare il namespace e lascia che sia questa dichiarazione a
# descriverlo. L'interruttore è per istanza e di default resta `native`: il pack
# si installa prima, si accende dopo.
connectors:
  - id: telegram
    manifest_version: 1
    namespace: telegram
    label: Telegram
    schemes:
      - scheme: tg
        direction: both
        label: Chat Telegram
        # Verbatim da `egress._DANGER["tg"]`: è la frase che l'owner legge al
        # gate prima di concedere, e cambiarla qui sarebbe cambiare, di fatto,
        # ciò su cui ha dato il consenso.
        danger: "una chat su Telegram, cioè su un'infrastruttura non tua."
        # Le DUE forme di `tg:`, e non ce n'è una terza (clodia-platform#363):
        # `egress._TG_GROUP` e `egress._TG_HANDLE`, stessi pattern.
        forms:
          - label: gruppo
            pattern: '^-?\d+$'
            example: '-1001234567890'
          - label: persona
            pattern: '^@[A-Za-z0-9_]{5,32}$'
            example: '@dadabit'
    providers:
      - id: bot
        label: Bot Telegram
        credential:
          kind: form
          vault_entry: telegram_bot_token
          fields:
            - name: token
              label: Bot token
              secret: true
              placeholder: '123456:ABC-DEF…'
    # Solo i due verbi che oggi il PDP controlla davvero (`egress._SPECS`), con
    # lo stesso argomento e lo stesso `dtype`. `telegram.inbox`/`poll` NON sono
    # qui come `source`: oggi non passano da `_RESOURCE_READ_VERBS`, e
    # dichiararli sarebbe inventare un controllo che non esiste.
    verbs:
      - verb: telegram.send
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
      - verb: telegram.send_file
        direction: egress
        scheme: tg
        arg: chat_id
        dtype: telegram
    # Letture che portano contenuto di terzi: `taint._TAINTING_EXACT`.
    taint:
      - telegram.inbox
      - telegram.receive
      - telegram.pull
      # 2.1.0 (#522/#558): as a gateway component these are no longer proxied
      # backend verbs, which tainted by default. `poll` returns the messages
      # themselves, `roster` names and handles written by third parties.
      - telegram.poll
      - telegram.roster
    # 2.1.0: no destination, no source, nothing third-party read — classified
    # so the gateway serves them as component verbs (unclassified = denied).
    unmapped: [telegram.lease_acquire, telegram.lease_release, telegram.status]
    # Il bottone del topic: oggi `topics_api.telegram_link`, che fa i DUE passi
    # insieme — whitelist `tg:<chat_id>` nelle due direzioni e binding del
    # canale. `binding: channel` è il secondo passo; senza, il messaggero non
    # riporta nulla pur con la whitelist scritta.
    topic_actions:
      - id: telegram-link
        label: Collega una chat Telegram
        binding: channel
        fields:
          - name: chat_id
            label: Chat id o @handle
        adds:
          ingress:
            - 'tg:{chat_id}'
          egress:
            - 'tg:{chat_id}'
    # La card della pagina Tools. Dalla fase 2 di #522 i campi sono quelli del
    # manifest del gateway (`builtin_manifests/telegram.yaml`) CAMPO PER CAMPO:
    # quando l'interruttore d'istanza passa a `pack`, quel documento esce di
    # servizio e questa card prende il suo posto — una copia diversa qui non
    # sarebbe «una variante», sarebbe la scheda che cambia da sola il giorno
    # della migrazione. `status_verb` ora c'è e non è una promessa a vuoto: il
    # backend MCP del pack implementa `telegram.status` davvero.
    tools_card:
      icon: telegram
      setup_label: Collega un bot
      status_verb: telegram.status
      blurb: >-
        Gli agenti inviano/ricevono messaggi (tool telegram.*) con lease
        per-chat. Crea un bot dedicato con @BotFather e incolla il token.
      scope: api.telegram.org/bot
    # Il contesto che il GATEWAY riempie a ogni chiamata dei verbi di questo
    # namespace, sovrascrivendo sempre quello che è arrivato dal chiamante
    # (clodia-platform#522, PR 1 — `manifest.CONTEXT_VALUES`). Qui non è un
    # vezzo: un connettore nativo legge canale e agente dal claim FIRMATO della
    # sessione, un backend di pack quel claim non ce l'ha. `telegram.send` senza
    # `chat_id` scrive nella chat legata al canale chiamante, e il lease è di un
    # agente per nome: se i due valori venissero dagli argomenti, dichiararne
    # altri basterebbe per scrivere nel gruppo di un altro topic o per rubare il
    # lease a qualcun altro.
    context:
      - arg: channel
        value: channel
      - arg: agent
        value: agent
    # `telegram.send_file` manda un file che sta in un TOPIC. Il percorso lo
    # nomina l'agente, i byte li mette il gateway: leggere un file di topic è
    # lavoro suo e non si sposta — ci stanno attaccati il compartimento (chi
    # chiama dev'essere partecipante di quel topic) e l'audit di ciò che
    # attraversa il confine. Un backend che leggesse da sé il filesystem dei
    # topic salterebbe entrambi, e il percorso lo sceglie il chiamante.
    # `chat_id` omesso = la chat legata al topic da cui si chiama. La risolve
    # il GATEWAY: il registro dei binding è suo, lo scrive il bottone del topic
    # e tiene quelli di tutti i connettori — un backend che lo leggesse da sé
    # leggerebbe anche gli altri. Un `chat_id` esplicito vince: se il default
    # sovrascrivesse non si potrebbe più scrivere a un'altra chat.
    defaults:
      - verb: telegram.send
        arg: chat_id
        value: binding
      - verb: telegram.send_file
        arg: chat_id
        value: binding
    files:
      - verb: telegram.send_file
        path_arg: path
        bytes_arg: content_b64
        name_arg: filename
        tier_arg: tier
        topic_arg: name
        chat_arg: chat_id

  # ── mail (clodia-platform#523) ─────────────────────────────────────────────
  # The mail vocabulary, moved here from the gateway's builtin manifest
  # (`server/connectors/builtin_manifests/mail.yaml` in clodia-tools). Every
  # scheme, verb, topic action, Tools card field and taint row below is that
  # document VERBATIM in meaning — labels and the gate's danger text included,
  # because they are what the owner reads before granting, and a different copy
  # here would be the page silently changing on migration day. A vendored copy
  # of the builtin sits in `server/agents/fixtures/523_builtin_mail.yaml` and
  # `test_523_mail_transport.py` compares the two field by field.
  #
  # Exactly three additions, all required for a NON-builtin manifest:
  #   1. `forms:` on `inbox` and `outbox` — a pack topic action may only write
  #      into a scheme that declares forms (SCHEMA.md, `topic_actions`), and
  #      `mailbox-link` writes `inbox:{address}` / `outbox:{address}`;
  #   2. `providers:` — `imap`, the IMAP/SMTP mailboxes this pack serves (no
  #      transport since 2.0.0: the code is the gateway component's);
  #   3. `unmapped:` — `email.folders` and `email.save_attachment` have no
  #      egress/source mapping and no taint row (#558): the gateway serves a
  #      COMPONENT verb only when the reviewed manifest classifies it. The PDP
  #      answers are the builtin's, unchanged.
  #
  # Division of labour (#558, superseding the transport design of #523): with
  # the instance switch `connectors: {mail: pack}` the gateway component in
  # `gateway/` implements the eight `email.*` verbs for every account and
  # every decision the gateway used to take inside them — account resolution,
  # mailbox whitelist (`inbox:`/`outbox:`), strict ingress (#503) and its
  # audit record, topic attachments in and out with taint, the reply recipient
  # (its `pdp_arguments` service) — reading the perimeter from the gateway per
  # call. The `mailbox_<acct>` credentials stay in the gateway's vault. A
  # Google account is served through google-pack's component. With the switch
  # on `native` (the default) nothing here runs.
  - id: mail
    manifest_version: 1
    namespace: email
    label: Email
    schemes:
      # `mailto:` = the RECIPIENT of a message.
      - scheme: mailto
        direction: egress
        label: Destinatario
        lowercase: true
        danger: >-
          un indirizzo email. Una volta inviato, il messaggio non è più
          richiamabile e la copia resta sul server del destinatario.
      # `mailfrom:` = the SENDER of a message that was read: it governs the
      # taint of the content, not access to the mailbox.
      - scheme: mailfrom
        direction: source
        label: Mittente
        lowercase: true
      # `inbox:`/`outbox:` = the MAILBOX a verb reads from or writes with. The
      # question is WHERE, not WHO. `forms:` is addition 1 (see above).
      - scheme: inbox
        direction: source
        label: Casella in lettura
        lowercase: true
        forms:
          - label: address
            pattern: '^[^@\s]+@[A-Za-z0-9.-]+$'
            example: 'studio@example.org'
      - scheme: outbox
        direction: egress
        label: Casella in scrittura
        lowercase: true
        forms:
          - label: address
            pattern: '^[^@\s]+@[A-Za-z0-9.-]+$'
            example: 'studio@example.org'
    # Addition 2: the IMAP/SMTP provider. No `transport:` and no `credential:`:
    # the code is this pack's gateway component, mailboxes are still added
    # from Tools → mailboxes and stay in the gateway's vault.
    providers:
      - id: imap
        label: IMAP/SMTP
    verbs:
      # One field may carry several addresses: `multi` splits them on comma
      # and semicolon, as today's extractor does.
      - verb: email.send
        direction: egress
        scheme: mailto
        arg: to
        multi: true
        dtype: email
      - verb: email.send
        direction: egress
        scheme: mailto
        arg: cc
        multi: true
        dtype: email
      - verb: email.send
        direction: egress
        scheme: mailto
        arg: bcc
        multi: true
        dtype: email
      # `email.reply` has no `to` in its arguments: the recipient comes from the
      # message being answered, i.e. from uncontrolled content. These mappings
      # read nothing → no destination → UNKNOWN → denied, unless the type
      # explicitly admits `*`. On purpose.
      - verb: email.reply
        direction: egress
        scheme: mailto
        arg: to
        multi: true
        dtype: email
      - verb: email.reply
        direction: egress
        scheme: mailto
        arg: cc
        multi: true
        dtype: email
      - verb: email.reply
        direction: egress
        scheme: mailto
        arg: bcc
        multi: true
        dtype: email
      # The source of a mail that was read is in the RESULT, not the arguments.
      - verb: email.read
        direction: source
        scheme: mailfrom
        arg: from
        reads: result
        normalise: email_from
    # The topic button: pick a mailbox ALREADY configured on the instance and it
    # becomes ingress and egress of this topic in one go. The field is an option
    # set (`options: mailboxes`), not free text: the address that lands in the
    # whitelist is resolved by the gateway. Admin only: a system mailbox is mail
    # that does not belong to the topic's owner (decision of 27 Sep 2026).
    topic_actions:
      - id: mailbox-link
        label: Autorizza una casella
        admin_only: true
        fields:
          - name: account
            label: Casella di sistema
            options: mailboxes
        adds:
          ingress:
            - 'inbox:{address}'
          egress:
            - 'outbox:{address}'
    tools_card:
      icon: email
      setup_label: Gestisci caselle
      blurb: >-
        Connettore multi-casella: aggiungi/togli mailbox IMAP/SMTP (info@,
        IONOS, …). Le caselle si autorizzano per canale, non per agente.
      scope: IMAP/SMTP
    # Incoming mail: the sender is not controlled. `email.read` is not here
    # because it has ONE declared source above; these three mix several senders
    # in one answer, so there is nothing to vet.
    taint:
      - email.list
      - email.search
      - email.get_attachment
    # Addition 3: no destination and no source the PDP reads — the mailbox
    # whitelist and strict ingress are the component's checks.
    unmapped: [email.folders, email.save_attachment]
