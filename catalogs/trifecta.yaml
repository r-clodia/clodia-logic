# Classificazione dei verbi tool nei tre lati della "lethal trifecta"
# (issue clodia-platform#77, DoD «classificazione dei verbi come
# configurazione VERSIONATA, non hard-coded»).
#
# I tre lati:
#   private_data     — l'agente può LEGGERE dati privati dell'istanza/owner
#   untrusted_input  — l'agente può ricevere contenuto scritto da terzi non
#                      controllati (web, issue, mail in arrivo, documenti caricati)
#   egress           — l'agente può far USCIRE dati verso l'esterno di Clodia
#
# Semantica di match (server/agents/trifecta.py): un grant e un pattern si
# considerano corrispondenti se i due pattern si SOVRAPPONGONO. Quindi il grant
# `email.*` accende `egress` perché copre `email.send`, mentre il grant
# `topic.write_file` NON accende `private_data` (nessun verbo di lettura).
# `*` copre tutto → 3/3 per costruzione.
#
# Una voce che inizia con `-` è un'ECCEZIONE: toglie dal lato i grant che vi
# ricadono interamente, senza toccare i grant più larghi. Serve a classificare
# per namespace (a prova di verbi futuri) senza che un verbo di sola uscita —
# `email.send` è l'esempio — accenda anche i lati di lettura: chi ha SOLO
# `email.send` non legge la posta, chi ha `email.*` sì.
#
# Nota deliberata: la SCRITTURA dentro Clodia (topic.write_file, topic.put,
# topic.post_message, memory.*, save_summary…) NON è egress — resta dentro il
# perimetro. È egress solo ciò che attraversa il confine dell'istanza.
#
# Nota sui falsi negativi noti (da rifinire, vedi issue #77):
#   - un verbo NUOVO non ancora classificato non accende alcun lato;
#   - una GET HTTP con parametri (`web.fetch?x=<dati>`) è un canale di
#     esfiltrazione reale ma qui è classificata solo come untrusted_input,
#     coerentemente con la classificazione dell'issue (il web che si legge è
#     il lato 2). L'egress via shell/`curl` non è classificabile affatto:
#     è il motivo del flag `shell` separato.
#
# ⚠️ ATTENZIONE ai pattern: il match è per NAMESPACE o per VERBO ESATTO, non
# glob. `_split()` riconosce solo `ns.*` e `*`: un pattern come
# `packs.install_*` o `telegram.lease_*` NON matcha nulla — è un pattern morto
# che sembra funzionare. I verbi vanno enumerati uno per uno.
#
# ── v2 (issue clodia-platform#104 §9, «correzione del catalogo») ────────────
# La classificazione precedente era stata scritta sui nomi PRESUNTI dei verbi;
# questa versione è riallineata all'elenco EFFETTIVO del gateway
# (`clodia-tools/server/main.py`, `Tool(name=…)`). Correzioni:
#   1. `fs.list_dir` non è lettura di dati privati (restituisce nomi e
#      dimensioni dentro `allowed_paths`, mai contenuto) → eccezione;
#   2. i connettori di terze parti (gcalendar, gdocs, trello, image, artifact,
#      mcp, packs) non erano classificati affatto: un agente con SOLI quei
#      verbi risultava 0/3 pur potendo esfiltrare;
#   3. rimosse le eccezioni verso verbi INESISTENTI (`email.send_file`,
#      `telegram.send_message`, `gdrive.create/write/put`);
#   4. `telegram.lease_acquire/lease_release` sono controllo d'accesso a una
#      chat, non lettura di contenuto → eccezione su entrambi i lati di lettura.
#
# Verbi deliberatamente in NESSUN lato (non è una dimenticanza):
#   - `gdrive.rename`: scrittura di solo metadato, non legge contenuto e non
#     ne fa uscire (`gdrive.move` invece sì: può spostare su uno Shared Drive);
#   - scritture interne a Clodia (`topic.write_file`, `memory.put`, …) e verbi
#     di sola introspezione locale (`packs.list`, `mcp.list`, `jobs.list`).
#
# CHIUSO il 3 ago 2026 (#119): i corpora di dominio montati come MCP esterni —
# `normattiva.*`, `contabilita.*`, `sedia.*` — erano deliberatamente NON
# classificati, ed erano indicati come candidati a `untrusted_input`. Il default
# fail-closed li avrebbe assunti `private_data` + `egress`, cioè i due lati che
# non hanno: ora sono classificati su `untrusted_input` e nulla più. Questo
# sposta di un lato i numeri per i tre seed documentali rispetto a #102, che li
# aveva misurati senza.
version: 2

private_data:
  # topic: contenuti, file e documenti dei canali dell'istanza
  - topic.open
  - topic.list
  - topic.search
  - topic.files
  - topic.read_file
  - topic.read_document
  - topic.fetch
  - topic.remote_status
  # memoria persistente dell'agente
  - memory.read
  - memory.list
  - memory.fetch
  - memory.get_document
  - memory.read_document
  - memory.list_documents
  # archivi di comunicazione dell'owner (i verbi di solo invio non leggono
  # nulla: sono classificati unicamente come egress)
  - email.*
  - -email.send
  - -email.reply
  - telegram.*
  - -telegram.send
  - -telegram.send_file
  # controllo d'accesso a una chat, non lettura di contenuto (#104 §9): un
  # postino che acquisisce il lease non legge niente.
  - -telegram.lease_acquire
  - -telegram.lease_release
  - gdrive.*
  - -gdrive.upload
  - -gdrive.share
  - -gdrive.mkdir
  - -gdrive.move
  - -gdrive.rename
  # calendario, documenti e board dell'owner: lettura di dati privati. I verbi
  # di sola scrittura verso il sistema di terzi sono esclusi e stanno in egress.
  - gcalendar.*
  - -gcalendar.create_event
  - -gcalendar.update_event
  - -gcalendar.delete_event
  - gdocs.*
  - -gdocs.create
  - -gdocs.append_text
  - -gdocs.replace_text
  # fogli dell'owner: budget, costi, anagrafiche. I verbi di sola scrittura
  # stanno in egress (clodia-platform#118).
  - gsheets.*
  - -gsheets.add_tab
  - -gsheets.append_rows
  - -gsheets.write_range
  - trello.*
  - -trello.create_card
  - -trello.comment
  - -trello.move_card
  # CRM: anagrafiche e contatti sono dato privato (#104 §8, voce impiegato-tomato)
  - leads.*
  # stato e configurazione dell'istanza (include credenziali e integrazioni)
  - settings.*
  # Amministrazione delle whitelist: `egress.list`/`ingress.list` restituiscono la
  # rubrica dell'owner, quindi il namespace è dato privato. NON è egress: `allow`
  # non spedisce niente, concede il permesso di spedire — e classificarlo come
  # uscita direbbe che un agente che amministra la lista sta esfiltrando, che è
  # falso e renderebbe il punteggio meno leggibile.
  - egress.*
  - ingress.*
  - integrations.*
  - providers.*
  - agents.*
  - profile.*
  - runtime.*
  - workflows.*
  - logs.*
  # `fs.list_dir` è l'unico verbo `fs.*` oggi ed è un FALSO POSITIVO: elenca
  # nomi e dimensioni dentro `allowed_paths` dell'agente, non restituisce mai
  # contenuto (#104 §9). Il namespace resta classificato perché un eventuale
  # `fs.read_file` futuro sarebbe invece lettura vera.
  - fs.*
  - -fs.list_dir
  # corpora indicizzati dell'istanza
  - rag.*
  - eu_corpus.*

untrusted_input:
  # web aperto
  - web.*
  # GitHub in lettura: issue, PR, commenti e codice sono scritti da terzi
  - github.get_file_contents
  - github.get_commit
  - github.get_label
  - github.get_latest_release
  - github.get_release_by_tag
  - github.get_tag
  - github.get_team_members
  - github.get_teams
  - github.issue_read
  - github.pull_request_read
  - github.list_branches
  - github.list_commits
  - github.list_issues
  - github.list_issue_fields
  - github.list_issue_types
  - github.list_pull_requests
  - github.list_releases
  - github.list_repository_collaborators
  - github.list_tags
  - github.search_code
  - github.search_commits
  - github.search_issues
  - github.search_pull_requests
  - github.search_repositories
  - github.search_users
  # posta e chat in ARRIVO: il mittente non è controllato
  - email.*
  - -email.send
  - -email.reply
  - telegram.*
  - -telegram.send
  - -telegram.send_file
  - -telegram.lease_acquire
  - -telegram.lease_release
  # file e documenti caricati in un topic da chiunque (incluso AGENTS.md)
  - topic.open
  - topic.search
  - topic.files
  - topic.read_file
  - topic.read_document
  - topic.fetch
  - topic.remote_pull
  # documenti esterni sincronizzati o indicizzati
  - gdrive.*
  - -gdrive.upload
  - -gdrive.share
  - -gdrive.mkdir
  - -gdrive.move
  - -gdrive.rename
  # eventi, documenti e card scritti da terzi (invitati, collaboratori del doc,
  # membri della board): contenuto non controllato che entra nel contesto.
  - gcalendar.*
  - -gcalendar.create_event
  - -gcalendar.update_event
  - -gcalendar.delete_event
  - gdocs.*
  - -gdocs.create
  - -gdocs.append_text
  - -gdocs.replace_text
  # un foglio condiviso è scritto da chiunque abbia il link in scrittura: celle
  # e nomi di tab sono contenuto non controllato che entra nel contesto.
  - gsheets.*
  - -gsheets.add_tab
  - -gsheets.append_rows
  - -gsheets.write_range
  - trello.*
  - -trello.create_card
  - -trello.comment
  - -trello.move_card
  - rag.*
  - eu_corpus.*
  # Corpora di dominio montati come MCP esterni. Erano deliberatamente NON
  # classificati (vedi la nota in testa a questo file): con il default fail-open
  # non accendevano nulla, e la scelta era sostenibile. Con il fail-closed di
  # #119 un namespace ignoto si assume `private_data` + `egress`, cioè
  # esattamente i due lati che questi verbi NON hanno: sono letture di contenuto
  # di terzi (norme, prassi contabile, bandi), non dati dell'owner e non un
  # canale di uscita. Classificarli su `untrusted_input` è la lettura che l'epic
  # #104 già indicava come probabile, ed è ora obbligata.
  - normattiva.*
  - contabilita.*
  - sedia.*

egress:
  - email.send
  # `email.reply` risponde in thread CON allegati locali: è uscita a tutti gli
  # effetti e non era classificata affatto (trovato riallineando all'elenco
  # reale dei verbi, #104 §9).
  - email.reply
  - telegram.send_file
  - telegram.send
  # GitHub in scrittura: pubblica fuori da Clodia
  - github.add_comment_to_pending_review
  - github.add_issue_comment
  - github.add_reply_to_pull_request_comment
  - github.create_branch
  - github.create_or_update_file
  - github.create_pull_request
  - github.create_repository
  - github.delete_file
  - github.fork_repository
  - github.issue_write
  - github.merge_pull_request
  - github.push_files
  - github.pull_request_review_write
  - github.request_copilot_review
  - github.sub_issue_write
  - github.update_pull_request
  - github.update_pull_request_branch
  # HTTP in uscita
  - web.post
  # remote git del topic: spinge i file del canale fuori dall'istanza
  - topic.remote_add
  - topic.remote_enable
  - topic.remote_commit
  - topic.remote_push
  # backup verso storage esterno (S3)
  - settings.backup_run
  # drive esterno in scrittura/condivisione
  - gdrive.upload
  - gdrive.share
  - gdrive.mkdir
  # sposta un file anche su uno Shared Drive → il contenuto esce dal perimetro
  - gdrive.move
  # ── connettori di terze parti (#104 §9) ─────────────────────────────────
  # Scritture verso sistemi non nostri: il contenuto attraversa il confine
  # dell'istanza esattamente come una mail. Prima non erano in alcun lato, cioè
  # un agente con SOLI questi verbi risultava 0/3 pur potendo esfiltrare.
  - gcalendar.create_event
  - gcalendar.update_event
  - gcalendar.delete_event
  - gdocs.create
  - gdocs.append_text
  - gdocs.replace_text
  # scritture su Google Sheets: il contenuto attraversa il confine dell'istanza
  # esattamente come una mail. `write_range` è anche l'unico verbo `gsheets.*`
  # che può sovrascrivere celle esistenti.
  - gsheets.add_tab
  - gsheets.append_rows
  - gsheets.write_range
  - trello.create_card
  - trello.comment
  - trello.move_card
  # il prompt viene inviato alla API immagini del provider (OpenAI gpt-image)
  - image.generate
  # `artifact.render` scrive DENTRO Clodia (files/artifact.html) e sembrerebbe
  # quindi non-egress per la regola generale. Lo è comunque: l'HTML viene
  # renderizzato nel browser dell'owner e la CSP dell'iframe
  # (clodia-web `ArtifactCanvas.svelte`) consente `img-src … https:` con
  # `script-src 'unsafe-inline'`. Una `<img src="https://…/?d=SEGRETO">` parte.
  # Il canale è la GET del browser, non la scrittura del file.
  - artifact.render
  # montare un MCP esterno / installare un pack significa introdurre verbi e
  # codice non controllati: uscita potenziale arbitraria, resa permanente.
  - mcp.add
  - packs.import_url
  - packs.install_npm
  - packs.install_pip

# Verbi che permettono di ALLARGARE la composizione del contesto: chi li ha
# può portare nel canale agenti che non erano partecipanti. Il punteggio si
# calcola sulla CHIUSURA, quindi la loro presenza estende l'insieme valutato
# a tutti gli agenti registrati (issue #77, «participant + spawn/delega»).
expansion:
  - topic.add_participant
  - agents.*
