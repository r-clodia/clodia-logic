# Provider Codex / ChatGPT (abbonamento OpenAI) — pezzo di sistema CLONABILE.
# Solo DEFINIZIONE (catalogo), MAI credenziali (→ vault del gateway). Il flusso
# OAuth (codex login su auth.openai.com → bundle auth.json) è in
# server/api/openai_oauth.py (campo `flow`). DPA consumer: NON adatto di default
# ai dati confidenziali. Costo fisso da abbonamento ChatGPT.
name: Codex / ChatGPT
mechanism: subscription
sdk: codex
flow: openai
priority: 20
cost_rank: 20
models: ["gpt-*", "o1*", "o3*", "o4*", "codex*"]
# ECCEZIONE, e vince su `models` qui sopra. L'autenticazione di QUESTO provider è
# l'account ChatGPT (mechanism: subscription), e quel meccanismo non abilita i
# modelli della famiglia "-codex". Non è una nostra policy: è il backend che
# risponde, con un 400 pulito e il motivo scritto dentro —
#
#   "The 'gpt-5-codex' model is not supported when using Codex with a ChatGPT account."
#
# (clodia-platform#333: turno di ophelia-8 perso il 2026-09-10, il modello era
# `gpt-5-codex` e il ripiego automatico era caduto qui). Lo stesso modello via
# `openai-api` (mechanism: apikey) funziona: la restrizione è del MECCANISMO, non
# del modello, e infatti sta in questo file e non in quello.
#
# Il glob copre l'intera famiglia (`gpt-5-codex`, `gpt-5-codex-mini`, …) mentre il
# 400 misurato nomina solo `gpt-5-codex`: è deliberato, perché qui sbagliare per
# eccesso costa un provider in meno fra i candidati e sbagliare per difetto costa
# un altro turno bruciato. `codex*` NON è toccato — nessun pattern qui combacia
# con un id che inizia per "codex".
models_excluded: ["*-codex*"]

# ── Sovranità (EC Cloud Sovereignty Framework v1.2.1) — SEAL eff = min(SOV-2/3/7)
sovereignty:
  seal: SEAL-1
  assessment: { SOV-2: SEAL-1, SOV-3: SEAL-0, SOV-7: SEAL-1 }
  dimensions:
    jurisdiction: us
    dpa: false                  # ChatGPT/codex consumer: nessun DPA
    dpa_url: "https://openai.com/policies/privacy-policy"
    no_training: default
    data_residency: us
    retention: standard
    cloud_act_exposed: true
  note: "Abbonamento consumer OpenAI: come claude-pro-max, non adatto a dati riservati di default."
