# Provider AWS Bedrock (region EU) — pezzo di sistema CLONABILE.
# Solo DEFINIZIONE (catalogo), MAI credenziali (→ vault del gateway).
# Modelli Claude serviti via Amazon Bedrock, region EU (Irlanda). DPA verificato.
# Già in uso su Clodia Primal (script `clodia`): una SOLA apikey (Bedrock API key)
# → AWS_BEARER_TOKEN_BEDROCK, niente AWS access key/secret.
name: AWS Bedrock (EU)
# Meccanismo: apikey, ma l'env è il bearer token Bedrock (non ANTHROPIC_API_KEY).
mechanism: apikey
apikey_env: AWS_BEARER_TOKEN_BEDROCK
# Env STATICHE aggiuntive da iniettare quando questo provider è effettivo:
# attiva la modalità Bedrock dell'SDK + region EU + i model id EU.
extra_env:
  CLAUDE_CODE_USE_BEDROCK: "1"
  AWS_REGION: eu-west-1
  # Default di FAMIGLIA: ultima spiaggia di `bedrock_model_id()` quando un seed
  # chiede una versione che non è in `model_ids` (e in quel caso il ripiego
  # finisce nei log). Portati alla versione più recente disponibile in regione:
  # erano fermi a opus-4-6 / sonnet-4-6, e siccome la vecchia traduzione
  # guardava solo la famiglia, OGNI agent opus girava su Opus 4.6 qualunque cosa
  # dichiarasse.
  ANTHROPIC_DEFAULT_OPUS_MODEL: "eu.anthropic.claude-opus-5"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "eu.anthropic.claude-sonnet-5"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"

# Traduzione ESPLICITA modello-del-seed → inference-profile della regione, così
# la versione che un agent dichiara è quella che gira davvero.
#
# Esplicita e non derivata da una regola (`eu.` + nome) perché i nomi dei
# profili NON sono regolari: `claude-opus-4-6` è `…-4-6-v1`, haiku porta data e
# versione, i modelli 2024 hanno entrambe. Una regola che sbaglia produce un 400
# di Bedrock a metà turno; una mappa che non conosce un modello nuovo ripiega
# sulla famiglia e lo dice nei log.
#
# Verificato con ListInferenceProfiles su eu-west-1 il 3 set 2026 (12 profili
# Claude EU). Quando ne compaiono di nuovi, questa lista va estesa: è il posto
# giusto in cui farlo, perché è la definizione del provider e viaggia col clone.
model_ids:
  claude-opus-5: "eu.anthropic.claude-opus-5"
  claude-opus-4-8: "eu.anthropic.claude-opus-4-8"
  claude-opus-4-7: "eu.anthropic.claude-opus-4-7"
  claude-opus-4-6: "eu.anthropic.claude-opus-4-6-v1"
  claude-opus-4-5: "eu.anthropic.claude-opus-4-5-20251101-v1:0"
  claude-sonnet-5: "eu.anthropic.claude-sonnet-5"
  claude-sonnet-4-6: "eu.anthropic.claude-sonnet-4-6"
  claude-sonnet-4-5: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
  claude-haiku-4-5: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
  claude-haiku-4-5-20251001: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
# SDK di esecuzione: i modelli Claude via Bedrock.
sdk: claude
priority: 20
cost_rank: 20
# Both forms are legitimate for THIS provider: an agent declares
# `claude-opus-4-8`, and `bedrock_model_id()` translates it into the EU
# inference profile Bedrock requires. The runtime override carries the
# TRANSLATED id, so a catalogue that lists only the declared form makes the
# provider reject its own translation — which silently disabled every
# SEAL-2 topic, since this is the only connected provider with SEAL >= 2.
models: ["claude-*", "eu.anthropic.*", "us.anthropic.*"]

# ── Sovranità (EC Cloud Sovereignty Framework v1.2.1) ────────────────────────
# SEAL effettivo (gating Clodia) = min(SOV-2 legale, SOV-3 dato/AI, SOV-7 sicurezza).
sovereignty:
  seal: SEAL-2
  assessment: { SOV-2: SEAL-2, SOV-3: SEAL-3, SOV-7: SEAL-3 }
  dimensions:
    jurisdiction: us            # AWS Inc., legge US (CLOUD Act) — possibile in teoria
    dpa: true                   # AWS GDPR DPA + SCC — verificato per eu-west-1
    dpa_url: "https://aws.amazon.com/compliance/gdpr-center/"
    no_training: true           # Bedrock non usa input/output per addestramento
    data_residency: eu          # eu-west-1 (Irlanda, SEE)
    retention: none             # Bedrock non conserva i prompt (no logging di default)
    cloud_act_exposed: true
  note: >
    Un gradino SOPRA i provider US-residency (Anthropic/OpenAI API = SEAL-1): qui il
    trattamento avviene fisicamente in SEE (eu-west-1) sotto DPA+SCC, con no-training
    e no-retention → SOV-2 e SOV-3 più alti. Il CLOUD Act resta possibile in teoria
    (controllo US) e impedisce il pieno SOVRANO (SEAL-3/4, riservati a giurisdizione/
    controllo EU: AWS European Sovereign Cloud o provider EU). → SEAL effettivo = SEAL-2,
    il miglior livello tra i provider a controllo US, ideale quando serve residenza EU.
